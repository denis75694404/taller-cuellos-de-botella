<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel del Facilitador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: una columna tipo app de mensajería — cabecera con sala, pestañas de etapa, barra del facilitador, panel con scroll, barra de escritura */
:root{
  --wall:#efeae2; --wall-dot:#e2dbd0; --panel:#ffffff; --bar:#f0f2f5; --line:#e2ddd5;
  --head:#0d5e4f; --head-fg:#ffffff; --head-muted:#cfe6df;
  --fg:#111b21; --muted:#5f6f78; --accent:#128c5e; --accent-fg:#ffffff; --accent-soft:#d8f3e6;
  --mine:#d9fdd3; --theirs:#ffffff; --tick:#2d9bdb; --sys:#fdf4c5; --sys-fg:#5a5230; --warn:#b4540a;
  --gold:#d79b00; --silver:#8a96a3; --bronze:#b0683a; --scrim:rgba(11,20,26,.45);
  --shadow:0 1px .5px rgba(11,20,26,.13); --lift:0 14px 30px -12px rgba(11,20,26,.35);
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wall:#0b141a; --wall-dot:#15212a; --panel:#111b21; --bar:#1f2c34; --line:#26353e;
  --head:#1f2c34; --head-fg:#e9edef; --head-muted:#8fa3ad;
  --fg:#e9edef; --muted:#93a4ad; --accent:#21c07a; --accent-fg:#06281a; --accent-soft:#103a2b;
  --mine:#005c4b; --theirs:#202c33; --tick:#53bdeb; --sys:#2a2a1c; --sys-fg:#f2d98a; --warn:#f0a35b;
  --gold:#e6b422; --silver:#a9b4bf; --bronze:#d08a5a; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px .5px rgba(0,0,0,.4); --lift:0 14px 30px -12px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#0b141a; --wall-dot:#15212a; --panel:#111b21; --bar:#1f2c34; --line:#26353e;
  --head:#1f2c34; --head-fg:#e9edef; --head-muted:#8fa3ad;
  --fg:#e9edef; --muted:#93a4ad; --accent:#21c07a; --accent-fg:#06281a; --accent-soft:#103a2b;
  --mine:#005c4b; --theirs:#202c33; --tick:#53bdeb; --sys:#2a2a1c; --sys-fg:#f2d98a; --warn:#f0a35b;
  --gold:#e6b422; --silver:#a9b4bf; --bronze:#d08a5a; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px .5px rgba(0,0,0,.4); --lift:0 14px 30px -12px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--wall);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
[hidden]{display:none!important}
.app{height:100%;display:grid;grid-template-rows:auto auto auto 1fr auto;grid-template-columns:minmax(0,1fr);min-height:0}
.inner{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--fg)}

/* pantallas de inicio */
.screen{min-height:100%;display:grid;place-items:center;padding-block:24px;background-color:var(--wall);background-image:radial-gradient(var(--wall-dot) 1.2px,transparent 1.3px),radial-gradient(var(--wall-dot) 1.2px,transparent 1.3px);background-size:26px 26px;background-position:0 0,13px 13px}
.screen .inner{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.brand h1{margin:0;font-family:var(--f-disp);font-weight:800;font-size:28px;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted)}
.scard{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:10px;animation:cardIn .5s cubic-bezier(.2,.9,.3,1.2) both}
.scard:nth-child(3){animation-delay:.08s}
.scard h2{margin:0;font-size:18px;font-family:var(--f-disp);font-weight:800}
.scard p{margin:0;color:var(--muted);font-size:14px}
.scard input,.scard textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bar);padding:11px 12px}
.scard textarea{min-height:170px;font-family:ui-monospace,Consolas,monospace;font-size:13px;resize:vertical}
.code-in{text-transform:uppercase;letter-spacing:.3em;font-family:var(--f-disp)!important;font-weight:800;font-size:22px!important;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--warn);font-size:13.5px}
.steps{margin:0;padding-left:20px;color:var(--fg);font-size:14px;display:flex;flex-direction:column;gap:4px}

/* cabecera */
header{background:var(--head);color:var(--head-fg);position:relative}
header .inner{display:flex;align-items:center;gap:12px;padding-block:10px}
.gavatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;perspective:160px}
.gavatar svg{width:22px;height:22px;animation:hg 5s cubic-bezier(.7,0,.3,1) infinite}
@keyframes hg{0%,62%{transform:rotateY(0) rotate(0)}82%,100%{transform:rotateY(360deg) rotate(180deg)}}
.htext{min-width:0;flex:1}
.htext h1{margin:0;font-size:16.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htext p{margin:0;font-size:13px;color:var(--head-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.codechip{flex:none;background:rgba(255,255,255,.14);color:var(--head-fg);border:0;border-radius:999px;padding:6px 12px;font-family:var(--f-disp);font-weight:800;letter-spacing:.12em;font-size:14px;display:flex;align-items:center;gap:6px;transition:background .2s,transform .15s}
.codechip:hover{background:rgba(255,255,255,.24)}
.codechip:active{transform:scale(.95)}
.codechip svg{width:16px;height:16px}

/* pestañas */
nav{background:var(--head)}
nav .inner{display:flex;gap:4px;position:relative}
.tab{flex:1;background:none;border:0;color:var(--head-muted);padding:10px 4px 12px;font-weight:600;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px;transition:color .2s}
.tab[aria-selected="true"]{color:var(--head-fg)}
.tab:disabled{opacity:.45;cursor:not-allowed}
.tab .live{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}80%,100%{box-shadow:0 0 0 8px transparent}}
.ink{position:absolute;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent);transition:left .35s cubic-bezier(.3,1.4,.5,1),width .35s cubic-bezier(.3,1.4,.5,1)}

/* barra del facilitador */
.fac{background:var(--bar);border-bottom:1px solid var(--line)}
.fac .inner{padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.fac .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600;color:var(--muted);transition:background .25s,color .25s,transform .15s}
.seg button:active{transform:scale(.94)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.switch{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;background:none;border:0;padding:4px 0}
.switch .knob{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .25s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.switch[aria-checked="true"] .knob{background:var(--accent)}
.switch[aria-checked="true"] .knob::after{transform:translateX(16px)}
.fac .spacer{flex:1}
.lnk{background:none;border:0;color:var(--accent);font-weight:600;font-size:13.5px;padding:4px 2px}
.lnk.danger{color:var(--warn)}

/* zona principal */
main{min-height:0;overflow-y:auto;overflow-x:hidden;background-color:var(--wall);background-image:radial-gradient(var(--wall-dot) 1.2px,transparent 1.3px),radial-gradient(var(--wall-dot) 1.2px,transparent 1.3px);background-size:26px 26px;background-position:0 0,13px 13px}
main .inner{padding-block:14px 18px;display:flex;flex-direction:column;gap:3px}
.view-in{animation:viewIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:perspective(900px) rotateX(9deg) translateY(16px)}}
.sys{align-self:center;background:var(--sys);color:var(--sys-fg);font-size:12.5px;border-radius:8px;padding:5px 12px;margin:6px 0;text-align:center;max-width:90%;box-shadow:var(--shadow)}
.day{align-self:center;background:var(--panel);color:var(--muted);font-size:12px;font-weight:600;border-radius:8px;padding:4px 12px;margin:8px 0;box-shadow:var(--shadow);text-transform:uppercase;letter-spacing:.05em}
.hidden-box{align-self:stretch;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin:8px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hidden-box .big{font-family:var(--f-disp);font-weight:800;font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.hidden-box .big.bump{animation:bump .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.4) rotateX(30deg)}}
.hidden-box p{margin:0;flex:1;min-width:180px;color:var(--muted)}
.hidden-box b{color:var(--fg)}

.msg{max-width:min(78%,540px);border-radius:9px;padding:6px 9px 6px 10px;box-shadow:var(--shadow);position:relative;overflow-wrap:anywhere;margin-top:6px;transition:filter .5s}
.msg.theirs{align-self:flex-start;background:var(--theirs);border-top-left-radius:0;transform-origin:0 100%}
.msg.mine{align-self:flex-end;background:var(--mine);border-top-right-radius:0;transform-origin:100% 100%}
.msg.blur .txt{filter:blur(7px);user-select:none}
.msg.enter{animation:pop .42s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:scale(.55) translateY(14px)}}
.msg .who{font-size:13px;font-weight:600;margin-bottom:1px}
.msg .txt{white-space:pre-wrap;transition:filter .6s}
.msg .meta{float:right;display:flex;align-items:center;gap:5px;margin:6px 0 -3px 12px;font-size:11px;color:var(--muted)}
.msg .meta svg{width:16px;height:11px;color:var(--tick)}
.msg.enter .meta svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.msg .del{background:none;border:0;padding:0 2px;color:var(--muted);font-size:11px;text-decoration:underline;opacity:.75}
.msg.q{align-self:flex-start;background:var(--theirs);border-radius:9px;border-top-left-radius:0;border-left:4px solid var(--accent)}
.msg.q .who{color:var(--accent)}
.msg.q .txt{font-weight:600;font-size:17px}
.msg.out{animation:out .3s ease forwards}
@keyframes out{to{opacity:0;transform:scale(.6) rotate(-4deg)}}
.lottie-empty{width:120px;height:80px;align-self:center}

/* barra de escritura */
.composer{background:var(--bar);border-top:1px solid var(--line)}
.composer .inner{padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:8px}
.field{flex:1;min-width:0;background:var(--panel);border-radius:22px;display:flex;align-items:flex-end;padding:4px 6px 4px 14px;transition:box-shadow .2s}
.field:focus-within{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
.field textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;resize:none;padding:7px 0;max-height:140px;line-height:1.35}
.send{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;transition:transform .2s cubic-bezier(.3,1.6,.5,1),opacity .2s;overflow:hidden}
.send:not(:disabled):hover{transform:scale(1.07)}
.send:active{transform:scale(.88)}
.send:disabled{opacity:.45;cursor:not-allowed}
.send svg{width:21px;height:21px}
.send.fly svg{animation:fly .55s ease}
@keyframes fly{40%{transform:translate(26px,-26px) rotate(-20deg);opacity:0}41%{transform:translate(-26px,26px);opacity:0}100%{transform:none;opacity:1}}

.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:600;background:var(--accent);color:var(--accent-fg);transition:transform .15s,box-shadow .2s,opacity .2s}
.btn:not(:disabled):hover{box-shadow:var(--lift)}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.warn{background:var(--warn);color:var(--panel)}
.btn.block{width:100%}

/* votación */
.card{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
.vhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.vhead h2,.rhead h2,.sec-t{margin:0;font-family:var(--f-disp);font-weight:800;font-size:22px;text-wrap:balance;letter-spacing:-.01em}
.vhead p,.rhead p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:60ch}
.chips{display:flex;gap:8px;margin-left:auto;perspective:300px}
.chip{width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.chip.used{border:2px solid var(--accent);background:var(--accent);color:var(--accent-fg)}
.chip.new{animation:chipFlip .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes chipFlip{from{transform:rotateY(-360deg) scale(.5)}60%{transform:rotateY(20deg) scale(1.2)}}
.chip svg{width:17px;height:17px}
.vlist{display:flex;flex-direction:column;gap:9px;perspective:1000px;margin-top:10px}
.vitem{--rx:0deg;--ry:0deg;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:2px solid transparent;border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .18s ease-out,box-shadow .25s,border-color .25s,background .25s}
.vitem:not(:disabled):hover{box-shadow:var(--lift)}
.vitem:disabled{cursor:default}
.vitem.enter{animation:cardIn .5s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d,0s)}
@keyframes cardIn{from{opacity:0;transform:rotateX(-35deg) translateY(24px)}}
.vitem[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.vitem.pulse{animation:flipPop .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes flipPop{40%{transform:rotateX(14deg) scale(.97)}}
.vitem .box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;margin-top:1px;transition:background .2s,border-color .2s,transform .35s cubic-bezier(.3,1.8,.5,1)}
.vitem[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);transform:scale(1.12)}
.vitem .box svg{width:16px;height:16px}
.vitem.pulse[aria-pressed="true"] .box svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .35s .1s ease forwards}
.vitem .body{min-width:0;flex:1}
.vitem .who{font-size:12.5px;font-weight:600;color:var(--muted)}
.vitem .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--muted)}

/* resultados: podio 3D */
.rhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px}
.stats{display:flex;gap:18px;margin-left:auto}
.stat b{display:block;font-family:var(--f-disp);font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:10px;padding:22px 4px 0;perspective:900px}
.pcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.pcol.r1{order:2}.pcol.r2{order:1}.pcol.r3{order:3}
.ptxt{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:9px 10px;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:5;line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.r1 .ptxt{font-weight:600;box-shadow:var(--lift)}
.pstep{position:relative;border-radius:4px 4px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:12px;color:#14110a;transform-origin:50% 100%;transform:rotateX(8deg)}
.pstep::before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px;background:inherit;filter:brightness(1.25);clip-path:polygon(7% 0,93% 0,100% 100%,0 100%)}
.r1 .pstep{height:150px;background:linear-gradient(180deg,var(--gold),color-mix(in srgb,var(--gold) 70%,#000))}
.r2 .pstep{height:112px;background:linear-gradient(180deg,var(--silver),color-mix(in srgb,var(--silver) 70%,#000))}
.r3 .pstep{height:84px;background:linear-gradient(180deg,var(--bronze),color-mix(in srgb,var(--bronze) 70%,#000))}
.pstep .pn{font-family:var(--f-disp);font-weight:800;font-size:34px;line-height:1}
.pstep .pv{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.85;font-variant-numeric:tabular-nums}
.podium.rise .pstep{animation:rise .8s cubic-bezier(.2,1.2,.4,1) both}
.podium.rise .r3 .pstep{animation-delay:.1s}.podium.rise .r2 .pstep{animation-delay:.3s}.podium.rise .r1 .pstep{animation-delay:.55s}
.podium.rise .ptxt{animation:fadeUp .5s ease both}
.podium.rise .r3 .ptxt{animation-delay:.7s}.podium.rise .r2 .ptxt{animation-delay:.85s}.podium.rise .r1 .ptxt{animation-delay:1.05s}
@keyframes rise{from{transform:rotateX(8deg) scaleY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px) scale(.95)}}
.crown{align-self:center;width:30px;height:24px;color:var(--gold);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px) rotate(4deg)}}
.rlist{display:flex;flex-direction:column;gap:8px}
.sec-t{font-size:17px;margin:14px 2px 2px}
.ritem{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.ritem.enter{animation:fadeUp .45s ease both;animation-delay:var(--d,0s)}
.ritem .pos{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:15px;background:var(--bar);color:var(--muted);grid-row:span 2}
.ritem.p1 .pos{background:var(--gold);color:#1b1400}
.ritem.p2 .pos{background:var(--silver);color:#11161b}
.ritem.p3 .pos{background:var(--bronze);color:#1c0d03}
.ritem .txt{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.ritem.top .txt{font-weight:600}
.ritem .n{font-family:var(--f-disp);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;text-align:right;grid-row:span 2}
.ritem .n small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted)}
.ritem .barwrap{grid-column:2;height:7px;background:var(--bar);border-radius:99px;overflow:hidden}
.ritem .bar{height:100%;background:var(--accent);border-radius:99px;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.ritem:not(.top) .bar{opacity:.45}
.prio{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.ractions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.empty{text-align:center;color:var(--muted);padding:24px 10px}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* capas emergentes */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--scrim);perspective:1000px;animation:fadeIn .25s ease;padding:16px;overflow-y:auto}
.overlay.bye{animation:fadeOut .35s ease forwards}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.ocard{background:var(--panel);color:var(--fg);border-radius:22px;box-shadow:var(--lift);padding:22px 26px 24px;text-align:center;max-width:400px;width:100%;animation:flipIn .7s cubic-bezier(.2,1.3,.4,1)}
.ocard.left{text-align:left;max-width:520px}
@keyframes flipIn{from{opacity:0;transform:rotateX(-80deg) translateY(-30px) scale(.8)}}
.ocard .lot{width:120px;height:120px;margin:0 auto}
.ocard .eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.ocard h3{margin:4px 0 6px;font-family:var(--f-disp);font-weight:800;font-size:28px;letter-spacing:-.01em}
.ocard p{margin:0;color:var(--muted)}
.ocard textarea,.ocard input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bar);padding:10px;margin:10px 0}
.ocard .row{justify-content:flex-end}
.bignum{font-family:var(--f-disp);font-weight:800;font-size:84px;line-height:1;color:var(--accent);display:inline-block;animation:spin3d 1s cubic-bezier(.2,1.2,.4,1)}
@keyframes spin3d{from{transform:rotateY(-540deg) scale(.4);opacity:0}}
.bigcode{font-family:var(--f-disp);font-weight:800;font-size:54px;letter-spacing:.14em;color:var(--accent);line-height:1.1;margin:6px 0}
.qr{background:#fff;padding:12px;border-radius:14px;display:inline-block;margin:8px auto;box-shadow:var(--shadow)}
.qr img,.qr canvas{display:block;width:220px!important;height:220px!important;max-width:100%}
.linkbox{font-size:12.5px;word-break:break-all;background:var(--bar);border-radius:10px;padding:8px 10px;margin:8px 0;color:var(--muted);user-select:all}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--panel);padding:9px 16px;border-radius:999px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center;z-index:40;transform:translateX(-50%);animation:toastIn .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px) scale(.9)}}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:560px){.tab{font-size:12px;letter-spacing:.02em}.stats{margin-left:0;width:100%}.chips{margin-left:0}.msg{max-width:88%}.r1 .pstep{height:120px}.r2 .pstep{height:92px}.r3 .pstep{height:70px}.pstep .pn{font-size:26px}.ptxt{font-size:12.5px}.bigcode{font-size:42px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* grupos */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.gcard{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px;border:2px solid transparent;text-align:left;transition:transform .2s,box-shadow .25s,border-color .25s;animation:cardIn .5s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d,0s)}
button.gcard:not(:disabled):hover{transform:translateY(-3px);box-shadow:var(--lift)}
button.gcard:disabled{opacity:.55;cursor:not-allowed}
.gcard.mine{border-color:var(--accent);background:var(--accent-soft)}
.gcard .gt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gcard h3{margin:0;font-family:var(--f-disp);font-weight:800;font-size:20px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--bar);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.full{background:var(--warn);color:var(--panel)}
.pill.ok{background:var(--accent);color:var(--accent-fg)}
.seats{display:flex;gap:5px}
.seats i{width:14px;height:14px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.seats i.on{background:var(--accent);animation:seat .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes seat{from{transform:scale(0)}}
.names{display:flex;flex-wrap:wrap;gap:4px}
.names span{font-size:12px;background:var(--bar);border-radius:999px;padding:2px 8px;color:var(--fg);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .mini{font-size:13.5px;color:var(--fg);border-left:3px solid var(--line);padding-left:8px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard .mini b{font-variant-numeric:tabular-nums;color:var(--accent);margin-right:4px}
.gcard .prog{height:7px;border-radius:99px;background:var(--bar);overflow:hidden}
.gcard .prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.gcard .open{align-self:flex-start;margin-top:auto}

/* selector de grupo del facilitador */
.gchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex-basis:100%;scrollbar-width:thin}
.gchip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;transition:background .2s,color .2s,transform .15s}
.gchip:active{transform:scale(.94)}
.gchip[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.gchip small{font-weight:700;opacity:.75;font-variant-numeric:tabular-nums}
.gchip.add{color:var(--accent);border-style:dashed}

/* temporizador */
.timer{flex:none;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-family:var(--f-disp);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer svg{width:17px;height:17px}
.timer.low{background:var(--warn);color:#fff;animation:beat 1s ease-in-out infinite}
.timer.over{background:rgba(255,255,255,.1);opacity:.8}
@keyframes beat{50%{transform:scale(1.08)}}
.tctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tctl input{width:64px;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:5px 10px;text-align:center;font-variant-numeric:tabular-nums}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;transition:transform .15s,background .2s}
.tbtn:active{transform:scale(.92)}
.tbtn.go{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bar);font-size:20px;font-weight:700}
.stepper b{font-family:var(--f-disp);font-weight:800;font-size:28px;min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.scard label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scard textarea.q{min-height:80px;font-family:var(--f-body);font-size:15px}
/* portada de las pantallas de acceso: imagen a la izquierda, tarjetas a la derecha */
.screen .inner.split{max-width:1060px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,500px);gap:28px;align-items:center}
.screen .col{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero{margin:0;position:relative;border-radius:26px;overflow:hidden;box-shadow:var(--lift);height:min(640px,calc(100dvh - 48px));min-height:460px;background:var(--head);animation:heroIn .8s cubic-bezier(.2,.8,.2,1) both}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kenburns 20s ease-in-out infinite alternate}
.hero.contain{background:#c4dfef}
.hero.contain img{object-fit:contain;object-position:center top;padding:20px 20px 96px;animation:floaty 7s ease-in-out infinite}
.hero figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 24px;display:flex;flex-direction:column;gap:4px;color:#fff;background:linear-gradient(180deg,transparent,rgba(4,24,18,.82))}
.hero.contain figcaption{background:linear-gradient(180deg,rgba(8,40,62,0),rgba(8,40,62,.86) 45%)}
.hero b{font-family:var(--f-disp);font-weight:800;font-size:27px;letter-spacing:-.01em;line-height:1.1;text-wrap:balance}
.hero span{font-size:14.5px;opacity:.92;max-width:44ch}
@keyframes heroIn{from{opacity:0;transform:perspective(1000px) rotateY(8deg) scale(.96)}}
@keyframes kenburns{to{transform:scale(1.08) translate(-1%,-1%)}}
@keyframes floaty{50%{transform:translateY(-6px)}}
.gavatar.photo{padding:0;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.gavatar.photo img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:860px){
  .screen .inner.split{grid-template-columns:minmax(0,1fr);max-width:520px;gap:14px}
  .hero{height:210px;min-height:0;border-radius:20px}
  .hero.contain{height:290px}
  .hero.contain img{padding:8px 8px 64px}
  .hero b{font-size:21px}
  .hero span{font-size:13.5px}
  .hero figcaption{padding:14px 16px}
}
/* chat anclado abajo y tarjeta de siguiente paso */
.app > header{grid-row:1}.app > nav{grid-row:2}.app > .ctl{grid-row:3}.app > main{grid-row:4}.app > .composer{grid-row:5}
main{display:flex;flex-direction:column}
main > .inner{flex:1 0 auto;width:100%}
#view.bottom{justify-content:flex-end}
.nextcard{align-self:stretch;background:var(--panel);border-radius:16px;box-shadow:var(--lift);padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:14px;animation:cardIn .5s cubic-bezier(.2,.9,.3,1.2) both}
.nextcard .ic{flex:none;width:54px;height:54px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:22px}
.nextcard .ic svg{width:26px;height:26px}
.nextcard .tx{flex:1 1 200px;min-width:0}
.nextcard h4{margin:0 0 2px;font-family:var(--f-disp);font-weight:800;font-size:19px;text-wrap:balance}
.nextcard p{margin:0;color:var(--muted);font-size:14px}
.nextcard .btn{flex:1 1 100%}
.nextcard .lottie-mini{width:54px;height:40px;flex:none}
/* respuesta ganadora */
.winner{align-self:stretch;position:relative;margin-top:12px;border-radius:22px;padding:22px 22px 24px;text-align:center;color:#fff;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--accent) 80%,#fff 20%),color-mix(in srgb,var(--accent) 55%,#000));box-shadow:var(--lift);overflow:hidden;perspective:800px}
.winner.rise{animation:winIn .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes winIn{from{opacity:0;transform:rotateX(-50deg) translateY(30px) scale(.9)}}
.winner::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 20deg,rgba(255,255,255,.10) 20deg 40deg,transparent 40deg 60deg,rgba(255,255,255,.10) 60deg 80deg,transparent 80deg 100deg,rgba(255,255,255,.10) 100deg 120deg,transparent 120deg);animation:rays 30s linear infinite}
@keyframes rays{to{transform:rotate(360deg)}}
.winner > *{position:relative}
.winner .trophy{width:62px;height:62px;margin:0 auto 4px;color:var(--gold);filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));animation:float 3s ease-in-out infinite}
.winner .lbl{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.winner .wt{margin:8px auto 10px;max-width:46ch;font-family:var(--f-disp);font-weight:800;font-size:clamp(20px,3.4vw,27px);line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.winner .wmeta{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.winner .wmeta span{background:rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.winner .tied{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.winner .tied div{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;font-weight:700;overflow-wrap:anywhere}
.ritem.win{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.ritem.win .pos{background:var(--gold);color:#1b1400}
/* quién falta */
.falta{font-size:12.5px;color:var(--warn);font-weight:600;overflow-wrap:anywhere}
.okall{font-size:12.5px;color:var(--accent);font-weight:700}
.mini.sol{border-left-color:var(--gold)}
.gchip .ico{width:15px;height:15px}
/* Bloque 2 */
.solcard{align-self:stretch;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:12px;border:2px dashed color-mix(in srgb,var(--accent) 45%,transparent)}
.solcard .eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.solcard h3{margin:0;font-family:var(--f-disp);font-weight:800;font-size:19px;text-wrap:balance}
.solcard textarea,.solcard input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bar);padding:10px 12px;font:inherit;color:var(--fg)}
.solcard textarea{resize:vertical;min-height:84px}
.solcard :disabled{opacity:.75}
/* proyección */
.proj{position:fixed;inset:0;z-index:35;overflow:auto;color:#fff;background:radial-gradient(120% 80% at 50% 0%,#11745a,#06261d);padding-block:clamp(16px,3vw,40px);padding-left:max(clamp(16px,3vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3vw,40px),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:clamp(12px,2vw,28px);animation:fadeIn .3s ease}
.pj-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pj-brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(14px,1.4vw,20px);opacity:.92;min-width:0}
.pj-brand img{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none}
.pj-x{flex:none;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:8px 16px;font-weight:700}
.pj-lbl{font-size:clamp(12px,1.2vw,17px);font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.82}
.pj-q h1{margin:6px 0 0;font-family:var(--f-disp);font-weight:800;font-size:clamp(26px,4vw,58px);line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.pj-stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.pj-clock{display:flex;flex-direction:column;align-items:center;margin-bottom:clamp(12px,2vw,28px)}
.pj-clock b{font-family:var(--f-disp);font-weight:800;font-size:clamp(64px,11vw,170px);line-height:1;font-variant-numeric:tabular-nums}
.pj-clock b.low{color:#ffb35c;animation:beat 1s ease-in-out infinite}
.pj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(10px,1.5vw,20px)}
.pj-card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:clamp(14px,1.6vw,24px);display:flex;flex-direction:column;gap:6px;min-width:0}
.pj-card h3{margin:0;font-family:var(--f-disp);font-size:clamp(18px,1.8vw,26px)}
.pj-big{font-family:var(--f-disp);font-weight:800;font-size:clamp(36px,4.5vw,64px);line-height:1;font-variant-numeric:tabular-nums}
.pj-card .prog{height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.pj-card .prog i{display:block;height:100%;background:#7ee2b5;border-radius:99px;transition:width .6s}
.pj-card.win .trophy{width:44px;height:44px;color:var(--gold)}
.pj-wt{font-weight:700;font-size:clamp(16px,1.6vw,22px);line-height:1.3;overflow-wrap:anywhere}
.pj-join{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(16px,3vw,48px);align-items:center}
.pj-code{font-family:var(--f-disp);font-weight:800;font-size:clamp(56px,10vw,150px);letter-spacing:.12em;line-height:1}
.pj-link{font-size:clamp(14px,1.5vw,22px);opacity:.85;word-break:break-all}
.pj-qr{padding:16px;border-radius:20px}
.pj-qr img,.pj-qr canvas{width:min(34vw,360px)!important;height:auto!important}
.pj-list{display:flex;flex-direction:column;gap:10px}
.pj-item{background:rgba(255,255,255,.1);border-radius:16px;padding:14px 18px;display:flex;gap:14px;align-items:baseline;font-size:clamp(16px,1.7vw,24px);overflow-wrap:anywhere}
.pj-item b{flex:none;color:#7ee2b5}
.pj-foot{text-align:center;opacity:.85;font-size:clamp(14px,1.4vw,20px)}
.pj-final{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.pj-final .trophy{width:clamp(70px,8vw,120px);height:auto;color:var(--gold);animation:float 3s ease-in-out infinite}
.pj-ft{font-family:var(--f-disp);font-weight:800;font-size:clamp(28px,4.2vw,64px);line-height:1.15;max-width:24ch;text-wrap:balance;overflow-wrap:anywhere}
.pj-ft small{display:block;font-family:var(--f-body);font-weight:600;font-size:clamp(14px,1.4vw,20px);opacity:.85;margin-top:8px}
@media (max-width:700px){.pj-join{grid-template-columns:1fr}}
/* encuesta */
.stars{display:flex;gap:6px;justify-content:center;margin:10px 0}
.star{border:0;background:none;font-size:40px;line-height:1;color:var(--line);transition:transform .2s cubic-bezier(.3,1.8,.5,1),color .2s}
.star.on{color:var(--gold)}
.star:hover{transform:scale(1.15)}
.edist{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.erow{display:grid;grid-template-columns:38px 1fr 28px;gap:8px;align-items:center;font-size:13.5px;font-variant-numeric:tabular-nums}
.erow .prog{height:8px;border-radius:99px;background:var(--bar);overflow:hidden}
.erow .prog i{display:block;height:100%;background:var(--gold)}
.ecoms{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;margin-bottom:10px}
.ecoms p{margin:0;color:var(--fg);font-style:italic}
/* sin conexión */
.net{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:45;background:var(--warn);color:#fff;padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:700;box-shadow:var(--lift);max-width:calc(100% - 32px);text-align:center}
.msg .meta svg.pend{color:var(--muted)}
/* accesibilidad */
.a11y-pill{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:6px 12px;font-weight:800}
.hbtn.a11y{font-weight:800;font-size:15px;width:auto;padding:0 10px;border-radius:999px}
.a11y-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
html.fs1 body{font-size:17px}
html.fs2 body{font-size:19px}
html.fs1 :is(.msg .txt,.vitem .txt,.ritem .txt,.mini,.field textarea,.scard p,.sys,.nextcard p,.wbanner p,.solcard textarea,.solcard input,.ptxt,.note,.hint,.falta,.okall){font-size:17px}
html.fs2 :is(.msg .txt,.vitem .txt,.ritem .txt,.mini,.field textarea,.scard p,.sys,.nextcard p,.wbanner p,.solcard textarea,.solcard input,.ptxt,.note,.hint,.falta,.okall){font-size:20px}
html.fs1 :is(.msg.q .txt,.qtext,.winner .wt){font-size:21px}
html.fs2 :is(.msg.q .txt,.qtext,.winner .wt){font-size:25px}
html:root.hc{--wall:#ffffff;--wall-dot:#ffffff;--panel:#ffffff;--bar:#efefef;--line:#4a545c;--fg:#000000;--muted:#262e33;--accent:#006b45;--accent-fg:#ffffff;--accent-soft:#d3efe1;--mine:#c6f3bf;--theirs:#ffffff;--sys:#fff1a0;--sys-fg:#231f00;--head:#00362a;--head-fg:#ffffff;--head-muted:#e8f3ef;--tick:#00539c;--warn:#a33a00;color-scheme:light}
html.hc :is(.msg,.card,.panel,.gcard,.vitem,.ritem,.scard,.solcard,.nextcard,.wbanner,.field){outline:1.5px solid var(--line)}
html.hc :focus-visible{outline:3px solid #000;outline-offset:3px}
/* celular: que nada se encime */
.tab,.step > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media (max-width:560px){
  header .inner{gap:6px}
  .gavatar{width:36px;height:36px}
  .htext{min-width:72px}
  .htext h1{font-size:15px}.htext p{font-size:12px}
  .timer{font-size:15px;padding:5px 9px;gap:4px}.timer svg,.timer .tl{display:none}
  .codechip{padding:0;width:36px;height:36px;justify-content:center}.codechip .cc-code{display:none}
  .hbtn{width:34px;height:34px}.hbtn.a11y{padding:0 8px;font-size:14px}
  nav .inner{gap:0}
  .tab{font-size:12.5px;text-transform:none;letter-spacing:0;padding:10px 2px 12px;gap:4px;min-width:0}

function ensureGroupSubs() {

  for (const [g, us] of S.gsubs) if (!want.has(g)) { us.forEach(u => u()); S.gsubs.delete(g); S.G.delete(g); }
  for (const g of want) {

    S.gsubs.set(g, [
      grupoRef(g).collection("respuestas").orderBy("ts").onSnapshot({ includeMetadataChanges: true }, q => { gdata(g).resp = q.docs.map(d => ({ id: d.id, ...d.data(), pend: d.metadata.hasPendingWrites })).filter(r => typeof r.t === "string"); S.G.set(g, gdata(g)); render(); }, fbError),

      grupoRef(g).collection("votos").onSnapshot(q => { gdata(g).votos = new Map(q.docs.map(d => [d.id, d.data()])); S.G.set(g, gdata(g)); render(); }, fbError)

function fbError(e) {

  const c = e?.code || "";
  if (c.includes("permission-denied")) toast("Firebase rechazó la operación. Revisa las reglas de Firestore, la etapa o el tiempo.", 5000);
  else if (c.includes("operation-not-allowed") || c.includes("admin-restricted")) toast("Activa el acceso Anónimo en Firebase → Authentication → Método de acceso.", 6000);
  else if (c.includes("unavailable")) toast("Sin conexión con Firebase. Revisa el internet.", 4000);
  else if (c.includes("failed-precondition")) toast("Firestore no está creado en tu proyecto. Créalo en la consola de Firebase.", 6000);
  else toast("Error de Firebase: " + (e?.message || c), 5000);

/* ---------- datos derivados ---------- */
function proposals(g, q = curQ()) { return gdata(g).resp.filter(r => qOf(r) === q).map(r => ({ key: r.id, uid: r.uid, a: r.nombre || "Participante", t: String(r.t).slice(0, 400), ts: +r.ts || 0, pend: !!r.pend })); }
const myProps = () => gdata(curG()).resp.filter(r => r.uid === S.uid && qOf(r) === qActiva());
const voteId = () => S.uid + "_" + qActiva();
const myVote = () => { const v = gdata(curG()).votos.get(voteId())?.id; return typeof v === "string" ? v : null; };
const votosDe = (g, q) => [...gdata(g).votos.values()].filter(d => qOf(d) === q);
function tally(g, q = curQ()) {
  const props = proposals(g, q), valid = new Set(props.map(p => p.key)), c = new Map();
  let voters = 0;
  for (const d of votosDe(g, q)) if (valid.has(d?.id)) { voters++; c.set(d.id, (c.get(d.id) || 0) + 1); }
  const ranked = props.map(p => ({ ...p, n: c.get(p.key) || 0 })).sort((a, b) => b.n - a.n || a.ts - b.ts);
  return { ranked, voters, votos: voters, props };
}

  const quitar = myVote() === key, antes = gdata(g).votos.get(vid);

/* ---------- avisos con sonido y vibración ---------- */
let AC = null;
document.addEventListener("pointerdown", () => {
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); else if (AC.state === "suspended") AC.resume(); } catch {}
}, { capture: true });
function tono(freqs, dur) {
  if (S.mute || !AC) return;
  try {
    let t = AC.currentTime;
    for (const f of freqs) {
      const o = AC.createOscillator(), gn = AC.createGain();
      o.type = "sine"; o.frequency.value = f;
      gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(0.22, t + 0.02); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02); t += dur * 0.85;
    }
  } catch {}
}
function vibrar(p) { if (S.mute) return; try { navigator.vibrate?.(p); } catch {} }
function aviso(tipo) {
  if (tipo === "30s") { tono([880, 880], 0.12); vibrar(300); }
  else { tono([523, 659, 784], 0.16); vibrar([120, 60, 120]); }
}

/* ---------- plenario: las ganadoras de todos los grupos ---------- */
const plen = () => { const p = S.room?.plenario; return p && p.q === qActiva() && Array.isArray(p.items) && p.items.length ? p : null; };
const plenFase = () => { const p = plen(); return p ? (!p.fin ? "preparacion" : Date.now() < p.fin ? "votacion" : "resultados") : null; };
const myPlenVote = () => { const p = plen(); return p ? (S.plen.get(S.uid + "_" + p.q)?.id || null) : null; };

  const c = new Map(); let voters = 0;
  for (const v of S.plen.values()) if (v.q === p.q && p.items.some(i => i.id === v.id)) { voters++; c.set(v.id, (c.get(v.id) || 0) + 1); }
  const ranked = p.items.map((it, i) => ({ ...it, key: it.id, n: c.get(it.id) || 0, ts: i })).sort((a, b) => b.n - a.n || a.ts - b.ts);

  if (items.length < 2) return toast(items.length ? "Solo hay una respuesta ganadora: no hace falta plenario." : "Aún no hay respuestas ganadoras en los grupos.", 4500);
  try {
    const old = await salaRef().collection("plenario").where("q", "==", q).get();
    if (!old.empty) { const b = S.db.batch(); old.docs.forEach(d => b.delete(d.ref)); await b.commit(); }

}

  rp.value = s.responsable || "";

    const sol = ta.value.trim(); if (!sol) return toast("Escribe la propuesta de solución.");
    try {
      await grupoRef(g).collection("soluciones").doc(q).set({ solucion: sol.slice(0, 600), responsable: rp.value.trim().slice(0, 100), por: (fac ? "Facilitador" : S.nombre || "Participante").slice(0, 50), uid: S.uid, ts: Date.now(), ...(tema ? { tema: tema.slice(0, 600) } : {}) });

    } catch (e) { fbError(e); }

  const gbar = h("div", { class: "groupbar", role: "group", "aria-label": "Ver grupo" },
    h("button", { class: "gchip", "aria-pressed": S.viewG === 0, onclick: () => { S.viewG = 0; S.facSig = ""; render(); } }, "Todos los grupos"),
    ...counts.map((n, i) => h("button", { class: "gchip", "aria-pressed": S.viewG === i + 1, onclick: () => { S.viewG = i + 1; S.facSig = ""; render(); } }, "Grupo " + (i + 1), h("small", {}, `${n}/${CUPO}`))),
    h("button", { class: "gchip", onclick: openProj, title: "Pantalla grande para el proyector" }, svgScreen(), "Proyectar"));

  $("facIn").replaceChildren(h("div", { class: "ctl-grid" }, qPanel, rPanel), gbar);
}
function toggleMenu(force) {
  const m = $("menu"), b = $("menuBtn"); if (!m) return;
  const open = force ?? m.hidden;
  if (open) {
    const item = (txt, fn, cls) => h("button", { role: "menuitem", class: cls || null, onclick: () => { toggleMenu(false); fn(); } }, txt);
    m.replaceChildren(
      item("Modo proyección (pantalla grande)", openProj),
      item("Mostrar el QR para entrar", () => shareOverlay()),
      h("hr"),
      item("📄 Informe final (imprimir o PDF)", informe),
      item("Descargar resultados (Excel/CSV)", downloadCSV),
      item("Copiar resultados de todos los grupos", () => copy(allResultsText(), "Resultados de todos los grupos copiados.")),
      h("hr"),
      item(S.room.encuesta ? "Cerrar la encuesta de cierre" : "⭐ Abrir la encuesta de cierre", () => { const v = !S.room.encuesta; setRoom({ encuesta: v }); toast(v ? "Encuesta abierta: aparecerá en el celular de cada participante." : "Encuesta cerrada."); }),
      item(`Ver resultados de la encuesta (${S.enc.size})`, encuestaResultados),
      h("hr"),
      item("Agregar un grupo", () => { setRoom({ grupos: nGrupos() + 1 }); toast(`Se agregó el Grupo ${nGrupos() + 1}.`); }),
      item("Texto, contraste y sonido", a11yPanel),
      h("hr"),
      item("Reiniciar respuestas y votos", confirmReset, "danger"),
      item("Empezar de cero (borrar la sala)", confirmEmpezarDeCero, "danger"));
  }
  m.hidden = !open; b.setAttribute("aria-expanded", String(open));
}

/* ---------- resumen de todos los grupos ---------- */
function viewSummary(tab) {
  const q = curQ(), activa = q === qActiva();
  const out = [banner(true), h("div", { class: "msg q", style: "align-self:stretch;max-width:none" }, h("div", { class: "who" }, `Pregunta ${qNum(q)}` + (activa ? " · activa en todos los grupos" : " · anterior (solo consulta)")), h("div", { class: "txt" }, qTexto(q)))];
  const cards = [];
  for (let g = 1; g <= nGrupos(); g++) {
    const ms = miembrosDe(g), t = tally(g, q), pr = proposals(g, q);
    let body;
    if (tab === "respuestas") {
      const falt = faltanResponder(g, q), hechos = ms.length - falt.length;
      body = [h("span", { class: "note" }, `${hechos} de ${ms.length} respondieron · ${pr.length} ${pr.length === 1 ? "respuesta" : "respuestas"}`),
        h("div", { class: "prog" }, h("i", { style: `width:${ms.length ? hechos / ms.length * 100 : 0}%` })),
        activa && ms.length ? faltaLinea(falt, "responder") : null, ...pr.slice(-2).map(r => h("div", { class: "mini" }, r.t))];
    } else if (tab === "votacion") {
      const falt = faltanVotar(g, q);
      body = [h("span", { class: "note" }, `${t.voters} de ${ms.length} votaron`), h("div", { class: "prog" }, h("i", { style: `width:${ms.length ? t.voters / ms.length * 100 : 0}%` })),
        activa && ms.length ? faltaLinea(falt, "votar") : null];
    } else {
      const sol = gdata(g).sol.get(q);
      body = ganadoras(t.ranked).map(r => h("div", { class: "mini" }, h("b", {}, "🏆"), r.t, ` (${r.n} ${r.n === 1 ? "voto" : "votos"})`));
      if (!body.length) body = [h("span", { class: "note" }, "Sin votos todavía.")];
      body.push(sol ? h("div", { class: "mini sol" }, h("b", {}, "💡"), sol.solucion, sol.responsable ? ` · Responsable: ${sol.responsable}` : "") : h("span", { class: "note" }, "Propuesta de solución pendiente"));
    }
    cards.push(h("button", { class: "gcard", style: `--d:${(g - 1) * 0.05}s`, onclick: () => { S.viewG = g; render(); } },
      h("div", { class: "gt" }, h("h3", {}, "Grupo " + g), h("span", { class: "pill" + (ms.length >= CUPO ? " ok" : "") }, `${ms.length}/${CUPO}`)),
      h("div", { class: "names" }, ...ms.map(([, m]) => h("span", {}, m.nombre || "Participante"))),
      ...body.filter(Boolean), h("span", { class: "lnk open" }, "Abrir grupo →")));
  }
  out.push(h("div", { class: "ggrid", style: "margin-top:10px" }, ...cards));
  out.push(h("div", { class: "ractions" },
    h("button", { class: "btn ghost", onclick: () => shareOverlay() }, "Mostrar el QR para que entren"),
    h("button", { class: "btn ghost", onclick: openProj }, "Modo proyección")));
  return out;
}

/* ---------- textos, CSV e informe ---------- */
function groupText(g, q = curQ()) {
  const { ranked, voters } = tally(g, q), win = ganadoras(ranked), sol = gdata(g).sol.get(q);
  const lines = [`Grupo ${g} · ${S.room.titulo || "Taller"}`, `Pregunta ${qNum(q)}: ${qTexto(q)}`, ""];
  ranked.forEach((r, i) => lines.push(`${i + 1}. ${r.t.replace(/\s+/g, " ")} (${r.n} ${r.n === 1 ? "voto" : "votos"})${win.includes(r) ? (win.length > 1 ? " · EMPATE 1.er LUGAR" : " · GANADORA") : ""}`));
  lines.push(`Votaron: ${voters} de ${miembrosDe(g).length}`);
  if (sol) lines.push(...(sol.tema ? [`Bloque 2 · Cuello de botella priorizado: ${sol.tema}`] : []), `Propuesta de solución: ${sol.solucion}`, `Responsable: ${sol.responsable || "—"}`);
  return lines.join("\n");
}
function downloadCSV() {
  const c = s => '"' + String(s ?? "").replace(/"/g, '""') + '"';
  // sin columna de autor; cada grupo cierra con una fila que suma sus votos
  const rows = [["N° pregunta", "Pregunta", "Grupo", "Puesto", "Respuesta", "Votos", "Ganadora", "Propuesta de solución", "Responsable"].map(c).join(";")];
  preguntas().forEach((p, pi) => {
    for (let g = 1; g <= nGrupos(); g++) {
      const rk = tally(g, p.id).ranked, win = ganadoras(rk), sol = gdata(g).sol.get(p.id);
      if (!rk.length) continue;
      rk.forEach((r, i) => { const w = win.includes(r); rows.push([pi + 1, p.t, `Grupo ${g}`, i + 1, r.t.replace(/\s+/g, " "), r.n, w ? (win.length > 1 ? "Empate" : "Sí") : "", w && sol && !sol.tema ? sol.solucion : "", w && sol && !sol.tema ? sol.responsable : ""].map(c).join(";")); });
      rows.push([pi + 1, p.t, `Grupo ${g}`, "", `TOTAL GRUPO ${g}`, rk.reduce((a, r) => a + r.n, 0), "", "", ""].map(c).join(";"));
    }
    const P = S.room.plenario;
    if (P && P.q === p.id) {
      const rk = plenTallyFor(P).ranked;
      rk.forEach((r, i) => rows.push([pi + 1, p.t, "Plenario", i + 1, `[Grupo ${r.g}] ${r.t.replace(/\s+/g, " ")}`, r.n, i === 0 && r.n > 0 ? "Ganadora del plenario" : "", "", ""].map(c).join(";")));
      rows.push([pi + 1, p.t, "Plenario", "", "TOTAL PLENARIO", rk.reduce((a, r) => a + r.n, 0), "", "", ""].map(c).join(";"));
    }
    for (let g = 1; g <= nGrupos(); g++) {
      const sol = gdata(g).sol.get(p.id);
      if (sol?.tema) rows.push([pi + 1, p.t, "Bloque 2 · Grupo " + g, "", sol.tema, "", "", sol.solucion, sol.responsable].map(c).join(";"));
    }
  });
  const a = h("a", { href: URL.createObjectURL(new Blob(["﻿" + rows.join("\r\n")], { type: "text/csv;charset=utf-8" })), download: `resultados-sala-${S.code}.csv` });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Descargado: resultados-sala-" + S.code + ".csv");
}
function informe() {
  const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const r = S.room, fecha = new Date().toLocaleDateString("es-PE", { day: "numeric", month: "long", year: "numeric" });
  let b = `<header><img src="${esc(new URL("img/administrador-icono.jpg", location.href).href)}" alt=""><div><h1>${esc(r.titulo || "Taller")}</h1>
    <p class="meta">Informe final · Sala ${esc(S.code)} · ${esc(fecha)} · ${S.miembros.size} participantes en ${nGrupos()} grupos</p></div></header>`;
  b += `<h2>Participantes</h2><table><tr><th>Grupo</th><th>Integrantes</th></tr>`;
  for (let g = 1; g <= nGrupos(); g++) b += `<tr><td>Grupo ${g}</td><td>${miembrosDe(g).map(([, m]) => esc(m.nombre)).join(", ") || "—"}</td></tr>`;
  b += `</table>`;
  preguntas().forEach((p, pi) => {
    b += `<section><h2>Pregunta ${pi + 1}</h2><p class="q">${esc(p.t)}</p>`;
    for (let g = 1; g <= nGrupos(); g++) {
      const { ranked, voters } = tally(g, p.id); if (!ranked.length) continue;
      const win = ganadoras(ranked), sol = gdata(g).sol.get(p.id);
      b += `<h3>Grupo ${g}</h3>`;
      if (win.length) b += `<div class="win">🏆 ${win.map(w => esc(w.t)).join(" <em>/</em> ")} <span>(${win[0].n} ${win[0].n === 1 ? "voto" : "votos"} de ${voters}${win.length > 1 ? " · empate" : ""})</span></div>`;
      if (sol && !sol.tema) b += `<div class="sol"><b>Propuesta de solución:</b> ${esc(sol.solucion)}<br><b>Responsable:</b> ${esc(sol.responsable || "—")}</div>`;
      b += `<table><tr><th>#</th><th>Respuesta</th><th>Autor</th><th>Votos</th></tr>${ranked.map((x, i) => `<tr${win.includes(x) ? ' class="w"' : ""}><td>${i + 1}</td><td>${esc(x.t)}</td><td>${esc(x.a)}</td><td>${x.n}</td></tr>`).join("")}</table>`;
    }
    const P = r.plenario;
    if (P && P.q === p.id) {
      const { ranked, voters } = plenTallyFor(P), win = ganadoras(ranked);
      b += `<h3>Plenario (${voters} votos)</h3>`;
      if (win.length) b += `<div class="win">🏆 ${win.map(w => esc(w.t) + ` <span>(Grupo ${w.g})</span>`).join(" <em>/</em> ")}</div>`;
      b += `<table><tr><th>#</th><th>Propuesta</th><th>Grupo</th><th>Votos</th></tr>${ranked.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.t)}</td><td>${x.g}</td><td>${x.n}</td></tr>`).join("")}</table>`;
    }
    const b2 = Array.from({ length: nGrupos() }, (_, i) => [i + 1, gdata(i + 1).sol.get(p.id)]).filter(([, x]) => x?.tema);
    if (b2.length) b += `<h3>Bloque 2 · Propuestas de solución</h3><div class="win">🏆 ${esc(b2[0][1].tema)}</div><table><tr><th>Grupo</th><th>Propuesta de solución</th><th>Responsable</th></tr>${b2.map(([g, x]) => `<tr><td>Grupo ${g}</td><td>${esc(x.solucion)}</td><td>${esc(x.responsable || "—")}</td></tr>`).join("")}</table>`;
    b += `</section>`;
  });
  const vals = [...S.enc.values()].filter(v => v.nota >= 1);
  if (vals.length) {
    const avg = vals.reduce((a, v) => a + v.nota, 0) / vals.length;
    b += `<section><h2>Encuesta de cierre</h2><p><b>${avg.toFixed(1)} de 5</b> · ${vals.length} respuestas</p>${vals.filter(v => v.comentario).map(v => `<p class="com">“${esc(v.comentario)}”</p>`).join("")}</section>`;
  }
  const doc = `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Informe · ${esc(r.titulo || "Taller")} · ${esc(S.code)}</title>
<style>body{font-family:"Segoe UI",system-ui,sans-serif;color:#111b21;max-width:880px;margin:0 auto;padding:28px 20px;line-height:1.45}
header{display:flex;gap:16px;align-items:center;border-bottom:3px solid #128c5e;padding-bottom:14px;margin-bottom:8px}header img{width:64px;height:64px;border-radius:50%;object-fit:cover}
h1{margin:0;font-size:26px}h2{margin:26px 0 6px;color:#0d5e4f;font-size:20px;border-bottom:1px solid #dfe5e2;padding-bottom:4px}h3{margin:16px 0 6px;font-size:16px}
.meta{margin:4px 0 0;color:#5f6f78}.q{font-weight:600;font-size:16px;margin:4px 0 10px}.win{background:#e7f6ee;border-left:4px solid #128c5e;padding:8px 12px;border-radius:6px;font-weight:600;margin:6px 0}
.win span{font-weight:400;color:#5f6f78}.sol{background:#fff8e1;border-left:4px solid #d79b00;padding:8px 12px;border-radius:6px;margin:6px 0}
table{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:14px}th,td{border:1px solid #dfe5e2;padding:6px 8px;text-align:left;vertical-align:top}th{background:#f0f2f5}tr.w td{background:#f2fbf6;font-weight:600}
.com{font-style:italic;color:#333;margin:4px 0}.bar{position:sticky;top:0;background:#fff;padding:10px 0;display:flex;gap:8px;justify-content:flex-end}
.bar button{background:#128c5e;color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer}section{break-inside:avoid-page}
@media print{.bar{display:none}body{padding:0}}</style></head><body><div class="bar"><button onclick="print()">Imprimir o guardar en PDF</button></div>${b}</body></html>`;
  const w = window.open("", "_blank");
  if (!w) return toast("Tu navegador bloqueó la ventana del informe. Permite ventanas emergentes para este sitio.", 5000);
  w.document.open(); w.document.write(doc); w.document.close();
}

/* ---------- borrar datos ---------- */
async function borrarColecciones(refs) {
  const docs = (await Promise.all(refs.map(c => c.get()))).flatMap(q => q.docs);
  for (let i = 0; i < docs.length; i += 400) { const b = S.db.batch(); docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
}
const coleccionesDeGrupos = () => Array.from({ length: nGrupos() }, (_, i) => i + 1).flatMap(g => ["respuestas", "votos", "soluciones"].map(c => grupoRef(g).collection(c)));
async function resetSala() {
  try {
    await borrarColecciones([...coleccionesDeGrupos(), salaRef().collection("plenario"), salaRef().collection("encuesta")]);
    await setRoom({ fin: null, voto: VOTO_MS, plenario: null, encuesta: false });
    S.seen.clear(); S.seenVote.clear(); S.seenRes.clear(); S.prevW.clear(); S.sig = "";
    toast("Se borraron las respuestas, votos, propuestas y encuesta de todos los grupos.");
  } catch (e) { fbError(e); }
}
async function empezarDeCero() {
  const code = S.code, ref = salaRef();
  S.wiping = true;
  loading("Borrando la sala " + code + "…");
  try {
    await borrarColecciones([ref.collection("miembros"), ...coleccionesDeGrupos(), ref.collection("plenario"), ref.collection("encuesta")]);
    S.unsub.forEach(u => u()); S.unsub = [];
    for (const [, us] of S.gsubs) us.forEach(u => u());
    await ref.delete();
    toast("Sala " + code + " borrada. Crea la nueva sala y sus grupos.", 4000);
  } catch (e) { fbError(e); }
  S.unsub.forEach(u => u()); S.unsub = [];
  for (const [, us] of S.gsubs) us.forEach(u => u());
  S.gsubs.clear(); S.G.clear(); S.miembros = new Map(); S.plen = new Map(); S.enc = new Map();
  Object.assign(S, { code: null, room: null, roomReady: false, miembrosReady: false, qSeen: null, faseSeen: null, viewG: 0, viewQ: null, tab: null, sig: "", facSig: "", endedFor: null, wiping: false, plenKey: undefined });
  S.seen.clear(); S.seenVote.clear(); S.seenRes.clear(); S.prevW.clear();
  closeProj();
  history.replaceState(null, "", location.pathname);
  homeScreen();
}

/* ---------- bienvenida ---------- */
function banner(fac) {
  const nombre = (S.nombre || "").split(" ")[0];
  return fac
    ? h("div", { class: "wbanner" }, h("div", { class: "bimg", style: "background-image:url('img/administrador.jpg')", "aria-hidden": "true" }),
        h("div", { class: "bt" }, h("div", { class: "eyebrow" }, "Taller DESEM"), h("h4", {}, "Cada idea puede destrabar un proceso"),
          h("p", {}, "Escucha a cada grupo: de estas respuestas saldrán las soluciones que nos harán avanzar.")))
    : h("div", { class: "wbanner" }, h("div", { class: "bimg contain", style: "background-image:url('img/grupo.jpg')", "aria-hidden": "true" }),
        h("div", { class: "bt" }, h("div", { class: "eyebrow" }, "Taller DESEM · Grupo " + curG()), h("h4", {}, nombre ? `¡Tu voz cuenta, ${nombre}!` : "¡Tu voz cuenta!"),
          h("p", {}, "Nadie conoce mejor los procesos que quienes los viven. Comparte lo que ves y construyamos juntos la solución.")));
}
const BIENVENIDA = ROLE === "admin" ? {
  img: "img/administrador.jpg", contain: false, eyebrow: "Taller DESEM · Te damos la bienvenida",
  t: "Hoy, cada idea puede destrabar un proceso",
  p: "Tienes en tus manos la conversación que muchos equipos esperaban. Lanza la pregunta, cuida el tiempo y escucha cada voz: de aquí saldrán las soluciones que harán avanzar a DESEM.",
  cta: "Empezar a facilitar →"
} : {
  img: "img/grupo.jpg", contain: true, eyebrow: "Taller DESEM · Te damos la bienvenida",
  t: "Tu experiencia vale. Tu voz cuenta.",
  p: "Nadie conoce mejor los procesos que quienes los viven cada día. Comparte lo que ves, escucha a tu equipo y vota por lo que de verdad importa: juntos vamos a destrabar lo que nos frena.",
  cta: "¡Quiero participar! →"
};
function welcome() {
  const B = BIENVENIDA;
  let close;
  const go = h("button", { class: "btn block", onclick: () => { close(); setTimeout(() => burst({ particleCount: 90, spread: 80, origin: { y: .7 } }), 150); } }, B.cta);
  close = overlay(h("div", { class: "ocard welcome", "aria-labelledby": "wTitle" },
    h("div", { class: "wimg" + (B.contain ? " contain" : ""), style: `background-image:url('${B.img}')`, role: "img", "aria-label": "" }),
    h("div", { class: "wbody" },
      h("div", { class: "eyebrow" }, B.eyebrow),
      h("h3", { id: "wTitle" }, B.t),
      h("p", {}, B.p),
      go)), 0);
  setTimeout(() => go.focus(), 300);
}
function joinedOverlay(g) {
  const lot = h("div", { class: "lot" });
  overlay(h("div", { class: "ocard" }, lot, h("div", { class: "eyebrow" }, "Ya eres parte del equipo"),
    h("h3", {}, `¡Bienvenido/a al Grupo ${g}, ${S.nombre.split(" ")[0]}!`),
    h("p", {}, "Lo que compartas hoy puede cambiar la forma en que trabajamos. Lee la pregunta y prepárate para responder.")), 3200);
  playLottie(lot, lottieCheck(), false);
  setTimeout(() => burst({ particleCount: 80, spread: 70, origin: { y: .6 } }), 400);
}

/* ---------- arranque ---------- */
async function start() {
  const cfg = getConfig();
  if (!cfg) return noConfigScreen();
  if (!window.firebase) return screen(h("div", { class: "scard" }, h("h2", {}, "Sin conexión"), h("p", {}, "No se pudo cargar Firebase. Revisa tu conexión a internet y recarga la página.")));
  S.cfg = cfg;
  loading("Conectando…");
  try {
    if (!firebase.apps.length) firebase.initializeApp(S.cfg);
    S.db = firebase.firestore();
    try { await S.db.enablePersistence({ synchronizeTabs: true }); } catch {}
    const cur = await new Promise(res => { const u = firebase.auth().onAuthStateChanged(x => { u(); res(x); }); });
    S.uid = (cur || (await firebase.auth().signInAnonymously()).user).uid;
  } catch (e) {
    fbError(e);
    return screen(h("div", { class: "scard" }, h("h2", {}, "No se pudo conectar con Firebase"), h("p", {}, (e.message || String(e)) + " Revisa firebase-config.js y que el acceso Anónimo esté activado.")));
  }
  if (ROLE === "admin") {
    try { S.isAdmin = (await S.db.collection("admins").doc(S.uid).get()).exists; } catch { S.isAdmin = false; }
    if (!S.isAdmin) return adminCodeScreen();
  }
  afterAuth();
}
function afterAuth() {
  const code = new URLSearchParams(location.search).get("sala");
  if (code) openSala(code.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6));
  else homeScreen();
}
welcome();
start();
</script>
